name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh from Google My Maps every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync places from Google My Maps
        run: python scripts/sync_mymaps.py --force

      - name: Stage static site
        run: |
          mkdir -p _site/data _site/icons/app _site/icons
          cp index.html app.js styles.css sw.js manifest.webmanifest kml-client.js _site/
          cp -r icons/app _site/icons/
          # Keep stock pin icons used by the sidebar swatches
          cp icons/*.png _site/icons/ 2>/dev/null || true
          cp data/places.json _site/data/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
